<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Pengaturan Alamat - TomTom Map</title>
  <!-- TomTom Maps SDK CSS -->
  <link rel='stylesheet' type='text/css' href='https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps.css'>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #map { width: 100%; height: 400px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    .btn-container { display: flex; gap: 10px; margin-bottom: 15px; }
    button { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; color: white; }
    .btn-save { background: #4CAF50; }
    .btn-save:hover { background: #45a049; }
    .btn-locate { background: #0078D7; }
    .btn-locate:hover { background: #005A9E; }
  </style>
</head>
<body>

  <h2>Pengaturan Alamat Pengguna</h2>
  
  <!-- Elemen Peta TomTom -->
  <div id="map"></div>

  <div class="btn-container">
    <button type="button" class="btn-locate" onclick="pusatkanKePosisiGPS()">📍 Pusatkan ke Posisi Saya</button>
  </div>

  <form id="formAlamat" onsubmit="simpanAlamat(event)">
    <div class="form-group">
      <label>Latitude (Kolom G):</label>
      <input type="text" id="latitude" name="latitude" readonly required>
    </div>
    
    <div class="form-group">
      <label>Longitude (Kolom H):</label>
      <input type="text" id="longitude" name="longitude" readonly required>
    </div>

    <div class="form-group">
      <label>Nama Jalan / Patokan Alamat Manual (Kolom I):</label>
      <input type="text" id="nama_jalan" name="nama_jalan" placeholder="Contoh: Jl. Poros, Gang Melati..." required>
    </div>

    <button type="submit" class="btn-save">Simpan Alamat</button>
  </form>

  <!-- TomTom Maps SDK JS -->
  <script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps-web.min.js"></script>
  <script>
    // Kunci API TomTom Anda
    var tomtomApiKey = 'eEDlFbYFgMqbARs7GYv39ogTM5MzYogE'; 
    
    // Koordinat default awal (Wilayah Karimun)
    var defaultLat = 0.9103;
    var defaultLng = 103.4435;

    var map, marker;
    var currentUserId = localStorage.getItem('id_user') || "USR0001"; 

    document.addEventListener("DOMContentLoaded", function() {
      // Inisialisasi peta langsung menggunakan koordinat default dulu agar style map aman dari error null
      initMap(defaultLat, defaultLng);

      // Setelah peta siap, coba ambil posisi GPS pengguna secara otomatis di latar belakang
      ambilLokasiAwal();
    });

    function initMap(lat, lng) {
      if (map) return; // Jika peta sudah ada, abaikan

      try {
        map = tt.map({
          key: tomtomApiKey,
          container: 'map',
          center: [lng, lat], // Format TomTom: [Longitude, Latitude]
          zoom: 15
        });

        map.addControl(new tt.NavigationControl());

        marker = new tt.Marker({ draggable: true })
          .setLngLat([lng, lat])
          .addTo(map);

        // Update input otomatis saat marker digeser
        marker.on('dragend', function() {
          var lngLat = marker.getLngLat();
          updateInputs(lngLat.lat, lngLat.lng);
        });

        // Update input otomatis saat peta diklik
        map.on('click', function(e) {
          var lngLat = e.lngLat;
          marker.setLngLat(lngLat);
          updateInputs(lngLat.lat, lngLat.lng);
        });

        // Set nilai awal ke form
        updateInputs(lat, lng);

      } catch (err) {
        console.error("Gagal memuat peta TomTom:", err);
      }
    }

    function ambilLokasiAwal() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function(position) {
            var userLat = position.coords.latitude;
            var userLng = position.coords.longitude;
            pindahkanPetaKe(userLat, userLng);
          },
          function(error) {
            console.warn("GPS timeout/ditolak saat muat awal, tetap menggunakan koordinat default.");
          },
          { timeout: 10000, enableHighAccuracy: true, maximumAge: 0 }
        );
      }
    }

    // Fungsi yang dipanggil saat tombol "Pusatkan ke Posisi Saya" ditekan
    function pusatkanKePosisiGPS() {
      if (!navigator.geolocation) {
        alert("Browser Anda tidak Mendukung Fitur Geolocation.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function(position) {
          var userLat = position.coords.latitude;
          var userLng = position.coords.longitude;
          pindahkanPetaKe(userLat, userLng);
          alert("Berhasil memperbarui posisi ke titik GPS Anda!");
        },
        function(error) {
          alert("Gagal mendeteksi GPS. Pastikan izin lokasi/GPS aktif di perangkat Anda.");
          console.error(error);
        },
        { timeout: 15000, enableHighAccuracy: true, maximumAge: 0 }
      );
    }

    function pindahkanPetaKe(lat, lng) {
      if (map && marker) {
        map.setCenter([lng, lat]);
        map.setZoom(16);
        marker.setLngLat([lng, lat]);
        updateInputs(lat, lng);
      }
    }

    function updateInputs(lat, lng) {
      document.getElementById('latitude').value = Number(lat).toFixed(6);
      document.getElementById('longitude').value = Number(lng).toFixed(6);
    }

    function simpanAlamat(event) {
      event.preventDefault();

      var latVal = document.getElementById('latitude').value;
      var lngVal = document.getElementById('longitude').value;
      var jalanVal = document.getElementById('nama_jalan').value;

      var payload = {
        action: "updateProfile",
        id_user: currentUserId,
        nama: localStorage.getItem('nama') || "User",
        email: localStorage.getItem('email') || "",
        latitude: latVal,
        longitude: lngVal,
        nama_jalan: jalanVal
      };

      // Ganti dengan URL Web App Google Apps Script Anda (yang berakhiran /exec)
      var scriptUrl = "URL_WEB_APP_APPS_SCRIPT_ANDA";

      fetch(scriptUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert("Alamat berhasil disimpan! Data masuk ke Kolom G, H, dan I di Google Sheets.");
      })
      .catch(err => {
        console.error("Error:", err);
        alert("Terjadi kesalahan saat menyimpan data.");
      });
    }
  </script>
</body>
</html>
