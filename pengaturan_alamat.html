<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Pengaturan Alamat - TomTom Map</title>
  <!-- TomTom Maps SDK CSS -->
  <link rel='stylesheet' type='text/css' href='https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps.css'>
  <style>
    #map { width: 100%; height: 400px; margin-bottom: 15px; }
    .form-group { margin-bottom: 10px; }
    label { display: block; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
  </style>
</head>
<body>

  <h2>Pengaturan Alamat Pengguna</h2>
  
  <div id="map"></div>

  <form id="formAlamat" onsubmit="simpanAlamat(event)">
    <div class="form-group">
      <label>Latitude (Kolom G):</label>
      <input type="text" id="latitude" name="latitude" readonly required>
    </div>
    
    <div class="form-group">
      <label>Longitude (Kolom H):</label>
      <input type="text" id="longitude" name="longitude" readonly required>
    </div>

    <div class="form-group">
      <label>Nama Jalan / Alamat Manual (Kolom I):</label>
      <input type="text" id="nama_jalan" name="nama_jalan" placeholder="Masukkan nama jalan atau patokan..." required>
    </div>

    <button type="submit">Simpan Alamat</button>
  </form>

  <!-- TomTom Maps SDK JS -->
  <script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps-web.min.js"></script>
  <script>
    // Ganti dengan API Key TomTom Anda
    var tomtomApiKey = 'MASUKKAN_TOMTOM_API_KEY_ANDA'; 
    
    // Default koordinat cadangan (misal: Wilayah Karimun)
    var defaultLat = 0.9103;
    var defaultLng = 103.4435;

    var map, marker;
    
    // Ambil ID user dari localStorage atau sesi aktif Anda
    var currentUserId = localStorage.getItem('id_user') || "USR0001"; 

    document.addEventListener("DOMContentLoaded", function() {
      // 1. Cek apakah di database (lewat localStorage/API Get) sudah ada data lat/lng sebelumnya
      // Jika kosong, gunakan Geolocation Browser atau Default Karimun
      initializeMapAndLocation();
    });

    function initializeMapAndLocation() {
      // Coba deteksi lokasi GPS perangkat pengguna secara otomatis
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function(position) {
            var userLat = position.coords.latitude;
            var userLng = position.coords.longitude;
            setupMap(userLat, userLng);
          },
          function(error) {
            console.warn("Gagal mendeteksi GPS browser, menggunakan koordinat default.");
            setupMap(defaultLat, defaultLng);
          },
          { timeout: 10000, enableHighAccuracy: true }
        );
      } else {
        setupMap(defaultLat, defaultLng);
      }
    }

    function setupMap(lat, lng) {
      map = tt.map({
        key: tomtomApiKey,
        container: 'map',
        center: [lng, lat], // Format TomTom: [Longitude, Latitude]
        zoom: 15
      });

      map.addControl(new tt.NavigationControl());

      marker = new tt.Marker({ draggable: true })
        .setLngLat([lng, lat])
        .addTo(map);

      // Update nilai input saat marker digeser
      marker.on('dragend', function() {
        var lngLat = marker.getLngLat();
        updateInputs(lngLat.lat, lngLat.lng);
      });

      // Update nilai input saat peta diklik
      map.on('click', function(e) {
        var lngLat = e.lngLat;
        marker.setLngLat(lngLat);
        updateInputs(lngLat.lat, lngLat.lng);
      });

      // Set nilai awal ke form
      updateInputs(lat, lng);
    }

    function updateInputs(lat, lng) {
      document.getElementById('latitude').value = Number(lat).toFixed(6);
      document.getElementById('longitude').value = Number(lng).toFixed(6);
    }

    function simpanAlamat(event) {
      event.preventDefault();

      var latVal = document.getElementById('latitude').value;
      var lngVal = document.getElementById('longitude').value;
      var jalanVal = document.getElementById('nama_jalan').value;

      var payload = {
        action: "updateProfile",
        id_user: currentUserId,
        nama: localStorage.getItem('nama') || "User", // Sesuaikan dengan data sesi user
        email: localStorage.getItem('email') || "",   // Sesuaikan dengan data sesi user
        latitude: latVal,
        longitude: lngVal,
        nama_jalan: jalanVal
      };

      // URL Web App Google Apps Script Anda
      var scriptUrl = "URL_WEB_APP_APPS_SCRIPT_ANDA";

      fetch(scriptUrl, {
        method: "POST",
        mode: "no-cors", // Atur sesuai kebutuhan deployment script Anda
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert("Alamat berhasil disimpan! Kolom G, H, dan I di Google Sheets telah diperbarui.");
      })
      .catch(err => {
        console.error("Error:", err);
        alert("Terjadi kesalahan saat menyimpan data.");
      });
    }
  </script>
</body>
</html>
