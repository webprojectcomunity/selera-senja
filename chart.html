<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Keranjang Belanja</title>
    <link rel="stylesheet" href="chart.css"> 
   
</head>
<body>
    <div class="app-container">
        <h2>Keranjang Belanja</h2>
        <p id="user-display" style="font-size: 14px; color: #7f8c8d; margin-bottom: 20px;"></p>

        <div id="cart-list">
            <p style="text-align: center; color: #7f8c8d;">Memuat isi keranjang...</p>
        </div>

        <div class="total-section" id="total-section" style="display: none;">
            <h3>Total Pembayaran: <span id="grand-total" style="color: #e74c3c;">Rp 0</span></h3>
        </div>

        <!-- Tombol Aksi Sejajar -->
        <div class="bottom-actions">
            <a href="landing_page.html" class="btn-kembali">← Kembali Belanja</a>
            <button id="btn-checkout" class="btn-lanjutkan-main">Lanjutkan Pembayaran →</button>
        </div>
    </div> <!-- Ditambahkan penutup app-container yang sempat hilang -->

    <script src="script_chart.js?v=3"></script>
</body>
</html>
