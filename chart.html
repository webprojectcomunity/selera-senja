<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Keranjang Belanja</title>
    <link rel="stylesheet" href="detail_pesanan.css"> 
    <style>
        /* Style Tambahan Keranjang */
        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
        }
        .cart-info {
            flex: 1;
            margin-right: 10px;
        }
        .cart-info h4 {
            margin: 0 0 5px 0;
            font-size: 16px;
        }
        .cart-info p {
            margin: 2px 0;
            font-size: 14px;
            color: #555;
        }

        .btn-hapus {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-hapus:disabled {
            background-color: #bdc3c7;
        }

        .total-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid #333;
            text-align: right;
        }

        /* Layout Tombol Aksi Bawah (Sejajar) */
        .bottom-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-kembali {
            background-color: #7f8c8d;
            color: white;
            border: none;
            padding: 12px 15px;
            border-radius: 6px;
            text-decoration: none;
            text-align: center;
            flex: 1;
            font-size: 14px;
            display: inline-block;
        }

        .btn-lanjutkan-main {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 15px;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            flex: 1;
            font-size: 14px;
            font-weight: 600;
        }
        .btn-lanjutkan-main:hover {
            background-color: #27ae60;
        }
        .btn-lanjutkan-main:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <h2>Keranjang Belanja</h2>
        <p id="user-display" style="font-size: 14px; color: #7f8c8d; margin-bottom: 20px;"></p>

        <div id="cart-list">
            <p style="text-align: center; color: #7f8c8d;">Memuat isi keranjang...</p>
        </div>

        <div class="total-section" id="total-section" style="display: none;">
            <h3>Total Pembayaran: <span id="grand-total" style="color: #e74c3c;">Rp 0</span></h3>
        </div>

        <!-- Tombol Aksi Sejajar -->
        <div class="bottom-actions">
            <a href="landing_page.html" class="btn-kembali">← Kembali Belanja</a>
            <button id="btn-checkout" class="btn-lanjutkan-main">Lanjutkan Pembayaran →</button>
        </div>
    </div> <!-- Ditambahkan penutup app-container yang sempat hilang -->

    <script src="script_chart.js"></script>
</body>
</html>
