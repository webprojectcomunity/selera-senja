<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input & Update Produk</title>
    <link rel="stylesheet" href="input_produk.css">
</head>
<body>

<div class="glass-form">
    <h2 id="formTitle">Tambah Produk</h2>

    <!-- PILIHAN MODE UPDATE / EDIT PRODUK -->
    <div class="input-group">
        <label>Mode / Pilih Produk (Opsional untuk Update)</label>
        <select id="selectProduk">
            <option value="">-- Tambah Produk Baru --</option>
            <!-- Daftar produk akan dimuat otomatis oleh JavaScript -->
        </select>
    </div>

    <!-- ID PRODUK TERSEMBUNYI UNTUK UPDATE -->
    <input type="hidden" id="idProduk">

    <div class="input-group">
        <label>Nama Produk</label>
        <input type="text" id="nama" placeholder="Contoh: Ayam Geprek">
    </div>

    <div class="input-group">
        <label>Deskripsi</label>
        <textarea id="deskripsi" rows="3" placeholder="Deskripsi produk..."></textarea>
    </div>

    <div class="input-group">
        <label>Harga</label>
        <input type="text" id="harga" placeholder="Contoh: 18k">
    </div>

    <div class="input-group">
        <label>Foto Produk</label>
        <input type="file" id="gambar" accept="image/*">
        <div class="preview" id="previewBox" style="display: none;">
            <img id="previewImg">
        </div>
    </div>

    <!-- FORM INPUT QR CODE -->
    <div class="input-group">
        <label>QR Code / QRIS (Format JPG)</label>
        <input type="file" id="qrCode" accept=".jpg, .jpeg, image/jpeg">
        <div class="preview" id="previewQrBox" style="display: none;">
            <img id="previewQrImg">
        </div>
    </div>

    <button class="btn-save" id="btnSubmit">
        Simpan Produk
    </button>

    <p id="status"></p>
</div>

<script src="input_produk.js"></script>

</body>
</html>
