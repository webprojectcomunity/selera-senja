<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Konfirmasi Pesanan</title>
    <link rel="stylesheet" href="detail_pesanan.css">
    <link rel="stylesheet" href="transaksi.css">
 
</head>
<body>

  <div class="app-container">
        <div class="header">
            <h2>Konfirmasi Pembayaran</h2>
        </div>

        <div class="transaksi-container">
            <!-- Ringkasan Item Pesanan -->
            <div class="section-box">
                <h3>Ringkasan Pesanan</h3>
                <div id="summary-items-container">
                    <p style="color: #7f8c8d; font-size: 13px;">Memuat ringkasan...</p>
                </div>
                <div style="display: flex; justify-content: space-between; margin-top: 12px; font-weight: bold; font-size: 16px; border-top: 1px dashed #ddd; padding-top: 10px;">
                    <span>Total Pembayaran:</span>
                    <span id="element-total-bayar" style="color: #e74c3c;">Rp 0</span>
                </div>
            </div>

            <!-- Pilihan Metode Pembayaran -->
            <div class="section-box">
                <h3>Metode Pembayaran</h3>
                <label class="payment-option">
                    <input type="radio" name="payment_method" value="tunai" checked>
                    <span>Tunai (Cash / Bayar di Tempat) - <em>Status: Sedang Dikemas</em></span>
                </label>
                <label class="payment-option">
                    <input type="radio" name="payment_method" value="QRIS">
                    <span>QRIS (Scan & Pay) - <em>Status: Belum Bayar</em></span>
                </label>
            </div>

            <!-- Catatan Transaksi -->
            <div class="section-box">
                <h3>Catatan Tambahan (Opsional)</h3>
                <textarea id="catatan-transaksi" placeholder="Contoh: Tolong segera dikirim / catatan khusus..." style="width: 100%; height: 70px; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; resize: none;"></textarea>
            </div>

            <!-- Tombol Eksekusi -->
            <button type="button" id="btn-proses-bayar" class="btn-proses" onclick="prosesPembayaranAkhir()">Konfirmasi & Bayar Sekarang</button>
        </div>
    </div>
   <script src="script_transaksi.js"></script>
</body>
</html>
