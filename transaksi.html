<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Konfirmasi Transaksi</title>
    <!-- Style Global dan Style Khusus Halaman Transaksi -->
    <link rel="stylesheet" href="detail_pesanan.css">
    <link rel="stylesheet" href="transaksi.css">
</head>
<body>

    <div class="app-container">
        <!-- Navigasi Atas -->
        <div class="header">
            <a href="chart.html" class="btn-kembali-header">← Keranjang</a>
            <h2>Konfirmasi Pembayaran</h2>
        </div>

        <!-- Card Informasi Pengguna -->
        <div class="section-card">
            <h3>Informasi Pemesan</h3>
            <div class="info-row">
                <span>Nama Pelanggan:</span>
                <strong id="user-display" style="color: #2c3e50;">-</strong>
            </div>
        </div>

        <!-- Card Daftar Makanan / Pesanan -->
        <div class="section-card">
            <h3>Rincian Pesanan</h3>
            <div id="order-items-list" class="items-list">
                <p style="text-align: center; color: #7f8c8d; font-size: 13px;">Memuat rincian pesanan...</p>
            </div>
            
            <div class="divider"></div>

            <div class="total-row">
                <span>Total Pembayaran:</span>
                <span id="grand-total">Rp 0</span>
            </div>
        </div>

        <!-- Card Pilih Metode Pembayaran -->
        <div class="section-card">
            <h3>Metode Pembayaran</h3>
            <div class="payment-options">
                <label class="payment-card active" id="label-tunai">
                    <input type="radio" name="payment_method" value="Tunai" checked onclick="pilihPembayaran('Tunai')">
                    <div class="payment-info">
                        <span>Tunai / Cash</span>
                        <small>Bayar langsung di kasir / tempat</small>
                    </div>
                </label>

                <label class="payment-card" id="label-qris">
                    <input type="radio" name="payment_method" value="QRIS" onclick="pilihPembayaran('QRIS')">
                    <div class="payment-info">
                        <span>QRIS / Non-Tunai</span>
                        <small>Scan QR via GoPay, OVO, Dana, BNI, dll.</small>
                    </div>
                </label>
            </div>

            <!-- Detail QRIS -->
            <div id="qris-box" class="qris-box" style="display: none;">
                <p>Silakan scan kode QRIS di bawah ini:</p>
                <img id="qris-image" src="qris_placeholder.png" alt="Kode QRIS Pembayaran">
                <span class="qris-note">*Pastikan nominal transfer sesuai dengan total pembayaran.</span>
            </div>
        </div>

        <!-- Card Catatan Tambahan -->
        <div class="section-card">
            <h3>Catatan Pesanan (Opsional)</h3>
            <textarea id="catatan-transaksi" placeholder="Contoh: Tanpa sambal, bungkus terpisah, dll."></textarea>
        </div>

        <!-- Tombol Aksi Akhir -->
        <button id="btn-proses-bayar" class="btn-checkout" onclick="prosesPembayaranAkhir()">Konfirmasi & Bayar Sekarang</button>
    </div>

    <!-- Script Pemrosesan Transaksi -->
    <script src="script_transaksi.js"></script>

    <script>
        function pilihPembayaran(metode) {
            const qrisBox = document.getElementById('qris-box');
            const labelTunai = document.getElementById('label-tunai');
            const labelQris = document.getElementById('label-qris');

            if (metode === 'QRIS') {
                qrisBox.style.display = 'block';
                labelQris.classList.add('active');
                labelTunai.classList.remove('active');
            } else {
                qrisBox.style.display = 'none';
                labelTunai.classList.add('active');
                labelQris.classList.remove('active');
            }
        }
    </script>
</body>
</html>
