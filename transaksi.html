<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Konfirmasi Pesanan</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS Script CDN Resmi -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- TomTom Maps SDK CSS -->
    <link rel="stylesheet" type="text/css" href="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps.css">
    <link rel="stylesheet" href="transaksi.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen py-4 sm:py-6 px-3 sm:px-4 flex justify-center items-center">

    <div class="w-full max-w-md bg-white sm:rounded-3xl shadow-xl border border-slate-100 overflow-hidden min-h-screen sm:min-h-[820px] flex flex-col justify-between relative">
        
        <!-- Header Top Bar -->
        <div class="w-full">
            <header class="flex items-center justify-between p-4 bg-white/80 backdrop-blur-md sticky top-0 z-20 border-b border-slate-100">
                <a href="chart.html" class="p-2 text-slate-700 hover:bg-slate-100 rounded-xl transition-colors">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </a>
                <h1 class="text-base font-bold text-slate-900">Konfirmasi Pembayaran</h1>
                <div class="w-9"></div>
            </header>

            <main class="p-4 space-y-4 pb-28">
                <!-- Ringkasan Item Pesanan -->
                <section class="bg-slate-50/80 p-4 rounded-2xl border border-slate-100 space-y-3">
                    <div class="flex items-center gap-2 text-slate-900 font-bold text-sm pb-2 border-b border-slate-200/60">
                        <i data-lucide="shopping-bag" class="w-4 h-4 text-emerald-600"></i>
                        <h2>Ringkasan Pesanan</h2>
                    </div>

                    <div id="summary-items-container" class="space-y-2 text-xs text-slate-600">
                        <p class="text-center text-slate-400 py-2">Memuat rincian pesanan...</p>
                    </div>

                    <div class="flex justify-between items-center pt-3 border-t border-dashed border-slate-200 font-bold text-sm">
                        <span class="text-slate-700">Total Pembayaran</span>
                        <span id="element-total-bayar" class="text-emerald-600 text-base">Rp 0</span>
                    </div>
                </section>

                <!-- Pilihan Metode Pembayaran -->
                <section class="bg-slate-50/80 p-4 rounded-2xl border border-slate-100 space-y-3">
                    <div class="flex items-center gap-2 text-slate-900 font-bold text-sm pb-1">
                        <i data-lucide="wallet" class="w-4 h-4 text-emerald-600"></i>
                        <h2>Metode Pembayaran</h2>
                    </div>

                    <div class="space-y-2">
                        <label class="payment-card flex items-center justify-between p-3 bg-white rounded-xl border border-slate-200 cursor-pointer transition-all">
                            <div class="flex items-center gap-3">
                                <input type="radio" id="pay-tunai" name="payment_method" value="Tunai" checked class="w-4 h-4 accent-emerald-600">
                                <div>
                                    <p class="text-xs font-bold text-slate-800">Tunai (COD)</p>
                                    <p class="text-[11px] text-slate-400">Bayar langsung saat produk tiba</p>
                                </div>
                            </div>
                            <i data-lucide="banknote" class="w-5 h-5 text-slate-400"></i>
                        </label>

                        <label class="payment-card flex items-center justify-between p-3 bg-white rounded-xl border border-slate-200 cursor-pointer transition-all">
                            <div class="flex items-center gap-3">
                                <input type="radio" id="pay-qris" name="payment_method" value="QRIS" class="w-4 h-4 accent-emerald-600">
                                <div>
                                    <p class="text-xs font-bold text-slate-800">QRIS (Scan & Pay)</p>
                                    <p class="text-[11px] text-slate-400">GoPay, OVO, Dana, ShopeePay, Bank</p>
                                </div>
                            </div>
                            <i data-lucide="qr-code" class="w-5 h-5 text-slate-400"></i>
                        </label>
                    </div>
                </section>

                <!-- Alamat Pengiriman (TomTom Map & Input Manual) -->
                <section class="bg-slate-50/80 p-4 rounded-2xl border border-slate-100 space-y-3">
                    <div class="flex items-center gap-2 text-slate-900 font-bold text-sm pb-1">
                        <i data-lucide="map-pin" class="w-4 h-4 text-emerald-600"></i>
                        <h2>Alamat Pengiriman</h2>
                    </div>

                    <!-- TomTom Map Box Container -->
                    <div class="static-map-box relative w-full h-36 rounded-xl overflow-hidden border border-slate-200 shadow-inner">
                        <div id="static-map" class="w-full h-full"></div>
                    </div>

                    <!-- Tombol GPS & Hint Peta -->
                    <button type="button" onclick="pusatkanKePosisiGPS()" class="w-full py-2 px-3 bg-blue-50 text-blue-600 rounded-xl text-xs font-bold flex items-center justify-center gap-2 border border-blue-100 transition-all hover:bg-blue-100">
                        <i data-lucide="locate-fixed" class="w-4 h-4"></i>
                        <span>Gunakan Lokasi GPS Saya</span>
                    </button>

                    <!-- Input Manual Nama Jalan / Patokan -->
                    <div class="space-y-1">
                        <label for="input-nama-jalan" class="text-xs font-semibold text-slate-600 block">Nama Jalan / Patokan / No. Rumah</label>
                        <div class="relative flex items-center">
                            <span class="absolute left-3 text-slate-400">
                                <i data-lucide="edit-3" class="w-4 h-4"></i>
                            </span>
                            <input type="text" id="input-nama-jalan" placeholder="Contoh: Jl. Poros, Gang Melati, Dekat Masjid..." class="w-full py-2.5 pl-9 pr-3 text-xs bg-white border border-slate-200 rounded-xl text-slate-800 outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all">
                        </div>
                    </div>
                </section>
            </main>
        </div>

        <!-- Sticky Floating Action Footer -->
        <footer class="fixed sm:absolute bottom-0 left-0 right-0 p-4 bg-white border-t border-slate-100 shadow-lg z-30">
            <button type="button" id="btn-proses-bayar" onclick="prosesPembayaranAkhir()" class="w-full py-3.5 px-4 bg-slate-900 hover:bg-slate-800 active:bg-slate-950 text-white text-sm font-bold rounded-xl transition-all shadow-md shadow-slate-900/10 flex items-center justify-center gap-2">
                <i data-lucide="check-circle" class="w-4 h-4"></i>
                <span>Konfirmasi & Bayar Sekarang</span>
            </button>
        </footer>

    </div>

   <!-- TomTom Maps SDK JS -->
   <script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps-web.min.js"></script>
   <script src="script_transaksi.js"></script>
   <script>
       document.addEventListener('DOMContentLoaded', () => {
           if (window.lucide) lucide.createIcons();
       });
   </script>
</body>
</html>
