<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pembayaran QRIS</title>
    <link rel="stylesheet" href="detail_pesanan.css">
    <link rel="stylesheet" href="transaksi.css">
    <style>
        .qris-container {
            text-align: center;
            padding: 20px;
            background: #fff;
            border-radius: 12px;
            margin: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .qris-container img {
            width: 250px;
            height: 250px;
            object-fit: contain;
            margin: 15px 0;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 10px;
        }
        .nominal-tagihan {
            font-size: 24px;
            font-weight: bold;
            color: #e74c3c;
            margin: 10px 0;
        }
        .btn-selesai {
            background-color: #27ae60;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h2>Scan QRIS Pembayaran</h2>
        </div>

        <div class="qris-container">
            <p>Silakan lakukan scan menggunakan aplikasi e-Wallet atau Mobile Banking Anda:</p>
            
            <div class="nominal-tagihan" id="display-nominal">Rp 0</div>
            <p style="font-size: 13px; color: #7f8c8d;" id="display-trx">ID Transaksi: -</p>

            <!-- Gambar Barcode QRIS -->
            <img id="img-qris-code" src="qris_placeholder.png" alt="QRIS Barcode">

            <div class="qris-note" style="margin-top: 10px; font-size: 12px; color: #e67e22;">
                *Pastikan nominal transfer sesuai dengan total tagihan di atas secara presisi.
            </div>

            <button class="btn-selesai" onclick="selesaiPembayaran()">Saya Sudah Membayar</button>
        </div>
    </div>

    <script>
        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const rawData = localStorage.getItem('active_qris_trx');
            if (!rawData) {
                alert("Sesi pembayaran tidak ditemukan.");
                window.location.replace('landing_page.html');
                return;
            }

            const trxData = JSON.parse(rawData);
            
            document.getElementById('display-nominal').innerText = formatRupiah(trxData.total_bayar);
            document.getElementById('display-trx').innerText = "ID Transaksi: " + trxData.id_transaksi;
            
            if (trxData.qr_code_url) {
                document.getElementById('img-qris-code').src = trxData.qr_code_url;
            }
        });

       function selesaiPembayaran() {
            if (confirm("Pastikan Anda sudah melakukan pembayaran via QRIS. Lanjutkan ke halaman status pesanan?")) {
                const rawData = localStorage.getItem('active_qris_trx');
                if (rawData) {
                    const trxData = JSON.parse(rawData);
                    
                    // Update status di LocalStorage daftar pesanan menjadi "Menunggu Verifikasi" / "Sedang Dikemas"
                    let daftarPesanan = JSON.parse(localStorage.getItem('user_orders') || '[]');
                    daftarPesanan = daftarPesanan.map(order => {
                        if (order.id_transaksi === trxData.id_transaksi) {
                            order.status = 'Menunggu Konfirmasi Pembayaran'; // atau Sedang Dikemas setelah diverifikasi admin
                        }
                        return order;
                    });
                    localStorage.setItem('user_orders', JSON.stringify(daftarPesanan));
                }

                localStorage.removeItem('active_qris_trx');
                window.location.replace('order_status.html');
            }
        }
    </script>
</body>
</html>
