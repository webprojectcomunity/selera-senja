<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat & Status Pesanan</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen py-6 px-4">

    <div class="max-w-xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="flex items-center justify-between bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-100">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-emerald-50 text-emerald-600 rounded-xl">
                    <i data-lucide="shopping-bag" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900 leading-tight">Riwayat Pesanan</h1>
                    <p class="text-xs text-slate-500">Pantau status & detail transaksi Anda</p>
                </div>
            </div>
            <button onclick="loadUserOrders()" class="p-2 text-slate-400 hover:text-emerald-600 hover:bg-slate-50 rounded-lg transition-colors" title="Muat Ulang">
                <i data-lucide="refresh-cw" class="w-5 h-5"></i>
            </button>
        </header>

        <!-- Order List Container -->
        <main id="order-container" class="space-y-4">
            <!-- Loading Skeleton State -->
            <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm animate-pulse space-y-4">
                <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                    <div class="h-4 bg-slate-200 rounded w-1/3"></div>
                    <div class="h-6 bg-slate-200 rounded-full w-20"></div>
                </div>
                <div class="space-y-2">
                    <div class="h-3 bg-slate-200 rounded w-1/2"></div>
                    <div class="h-3 bg-slate-200 rounded w-2/3"></div>
                </div>
            </div>
        </main>

        <!-- Navigation Button -->
        <footer class="pt-2">
            <a href="index.html" class="flex items-center justify-center gap-2 w-full py-3.5 px-4 bg-slate-900 hover:bg-slate-800 active:bg-slate-950 text-white font-medium text-sm rounded-xl transition-all shadow-md shadow-slate-900/10">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                Kembali ke Beranda
            </a>
        </footer>

    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwBLIlk6lbANUmDwdUkMtldg0AB5aDD-9_7bAQJ6UAbcTHZeHwlnLluwyXIG2jWRxNX/exec';
        
        const currentIdUser = localStorage.getItem('idUser') || '';
        const urlParams = new URLSearchParams(window.location.search);
        const transaksiTerakhir = urlParams.get('trx') || localStorage.getItem('last_transaction_id') || '';

        document.addEventListener('DOMContentLoaded', () => {
            if (!currentIdUser) {
                alert("Sesi berakhir atau ID Pengguna tidak ditemukan, silakan login kembali.");
                window.location.replace('index.html');
                return;
            }
            
            localStorage.removeItem('user_orders');
            loadUserOrders();
        });

        async function loadUserOrders() {
            const container = document.getElementById('order-container');
            container.innerHTML = `
                <div class="bg-white p-8 rounded-2xl border border-slate-100 text-center space-y-3">
                    <div class="inline-block p-3 bg-slate-50 text-emerald-600 rounded-full animate-spin">
                        <i data-lucide="loader-2" class="w-6 h-6"></i>
                    </div>
                    <p class="text-sm font-medium text-slate-600">Sinkronisasi pesanan dari server...</p>
                </div>
            `;
            lucide.createIcons();

            try {
                const url = `${APPS_SCRIPT_URL}?action=getTransactions&id_user=${encodeURIComponent(currentIdUser.trim())}`;
                const response = await fetch(url);
                const result = await response.json();
                
                let ordersArray = [];
                if (Array.isArray(result)) {
                    ordersArray = result;
                } else if (result && result.success && Array.isArray(result.data)) {
                    ordersArray = result.data;
                } else if (result && Array.isArray(result.data)) {
                    ordersArray = result.data;
                }

                if (ordersArray.length > 0) {
                    ordersArray.reverse();
                    renderOrders(ordersArray, transaksiTerakhir);
                    localStorage.setItem('user_orders', JSON.stringify(ordersArray));
                } else {
                    renderOrders([], transaksiTerakhir);
                    localStorage.removeItem('user_orders');
                }

            } catch (error) {
                console.error("Gagal sinkronisasi pesanan:", error);
                container.innerHTML = `
                    <div class="bg-red-50/50 p-6 rounded-2xl border border-red-100 text-center space-y-2">
                        <i data-lucide="alert-triangle" class="w-8 h-8 text-red-500 mx-auto"></i>
                        <p class="text-sm font-semibold text-red-700">Gagal Memuat Pesanan</p>
                        <p class="text-xs text-red-500">Periksa koneksi internet Anda dan coba lagi.</p>
                    </div>
                `;
                lucide.createIcons();
            }
        }

        function renderOrders(orders, activeTrxId) {
            const container = document.getElementById('order-container');
            if (!orders || orders.length === 0) {
                container.innerHTML = `
                    <div class="bg-white p-8 rounded-2xl border border-slate-100 text-center space-y-3">
                        <div class="inline-block p-3 bg-slate-50 text-slate-400 rounded-full">
                            <i data-lucide="package-x" class="w-8 h-8"></i>
                        </div>
                        <div>
                            <p class="text-sm font-semibold text-slate-800">Belum Ada Pesanan</p>
                            <p class="text-xs text-slate-500 mt-1">Anda belum membuat transaksi apa pun.</p>
                        </div>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            container.innerHTML = '';
            orders.forEach(order => {
                const rawStatus = order.status !== undefined && order.status !== null ? String(order.status) : 'Pending';
                const statusClean = rawStatus.toLowerCase();
                
                // Config badge status
                let badgeStyle = 'bg-amber-50 text-amber-700 border-amber-200/60';
                let iconName = 'clock';

                if (statusClean.includes('dikemas')) {
                    badgeStyle = 'bg-blue-50 text-blue-700 border-blue-200/60';
                    iconName = 'box';
                } else if (statusClean.includes('selesai')) {
                    badgeStyle = 'bg-emerald-50 text-emerald-700 border-emerald-200/60';
                    iconName = 'check-circle-2';
                } else if (statusClean.includes('belum') || statusClean.includes('batal')) {
                    badgeStyle = 'bg-rose-50 text-rose-700 border-rose-200/60';
                    iconName = 'alert-circle';
                }

                const isCurrentTrx = activeTrxId && String(order.id_transaksi).trim() === String(activeTrxId).trim();
                
                // Parse item produk
                let itemsArray = [];
                if (Array.isArray(order.items)) {
                    itemsArray = order.items;
                } else if (typeof order.items === 'string') {
                    try {
                        itemsArray = JSON.parse(order.items);
                    } catch (e) {
                        itemsArray = [];
                    }
                }

                // Render list item
                let itemsHtml = '';
                if (itemsArray.length > 0) {
                    itemsHtml = '<div class="space-y-2 mt-2">';
                    itemsArray.forEach(item => {
                        const nama = item.nama_produk || item.nama || 'Produk';
                        const qty = parseInt(item.jumlah || item.qty || 1, 10);
                        const hargaSatuan = parseFloat(item.harga_satuan || item.harga || 0);
                        
                        let subtotal = 0;
                        if (item.subtotal !== undefined && item.subtotal !== null && item.subtotal !== '') {
                            subtotal = parseFloat(item.subtotal);
                        } else if (item.total_harga !== undefined && item.total_harga !== null && item.total_harga !== '') {
                            subtotal = parseFloat(item.total_harga.toString().replace(/[^0-9.-]/g, ''));
                        } else {
                            subtotal = hargaSatuan * qty;
                        }

                        itemsHtml += `
                            <div class="flex justify-between items-start text-xs border-b border-slate-50 pb-2 last:border-0 last:pb-0">
                                <div>
                                    <p class="font-medium text-slate-800">${nama}</p>
                                    <p class="text-slate-400 mt-0.5">${qty}x @ Rp ${Number(hargaSatuan).toLocaleString('id-ID')}</p>
                                </div>
                                <span class="font-semibold text-slate-700">Rp ${Number(subtotal || 0).toLocaleString('id-ID')}</span>
                            </div>`;
                    });
                    itemsHtml += '</div>';
                } else {
                    itemsHtml = '<p class="text-xs italic text-slate-400">Tidak ada rincian item.</p>';
                }

                const card = document.createElement('div');
                card.className = `bg-white rounded-2xl border transition-all duration-200 overflow-hidden shadow-sm hover:shadow-md ${isCurrentTrx ? 'border-emerald-500 ring-2 ring-emerald-500/10' : 'border-slate-200/80'}`;
                
                card.innerHTML = `
                    ${isCurrentTrx ? `<div class="bg-emerald-500 text-white text-[11px] font-semibold py-1 px-3 text-center flex items-center justify-center gap-1"><i data-lucide="sparkles" class="w-3 h-3"></i> Pesanan Terbaru</div>` : ''}
                    
                    <div class="p-4 sm:p-5 space-y-4">
                        <!-- Header Card -->
                        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                            <div class="space-y-0.5">
                                <span class="text-xs font-bold text-slate-900 tracking-wide">${order.id_transaksi || 'TRX-XXXX'}</span>
                                <p class="text-[11px] text-slate-400 flex items-center gap-1">
                                    <i data-lucide="calendar" class="w-3 h-3"></i>
                                    ${order.tanggal ? new Date(order.tanggal).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }) : '-'}
                                </p>
                            </div>
                            <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium border ${badgeStyle}">
                                <i data-lucide="${iconName}" class="w-3.5 h-3.5"></i>
                                ${rawStatus}
                            </span>
                        </div>

                        <!-- User Info -->
                        <div class="bg-slate-50/80 rounded-xl p-3 text-xs space-y-1.5 border border-slate-100">
                            <div class="flex items-center gap-2 text-slate-700 font-medium">
                                <i data-lucide="user" class="w-3.5 h-3.5 text-slate-400"></i>
                                <span>${order.user || order.nama_user || '-'}</span>
                            </div>
                            ${order.no_hp ? `
                            <div class="flex items-center gap-2 text-slate-500">
                                <i data-lucide="phone" class="w-3.5 h-3.5 text-slate-400"></i>
                                <span>${order.no_hp}</span>
                            </div>` : ''}
                            ${order.email ? `
                            <div class="flex items-center gap-2 text-slate-500">
                                <i data-lucide="mail" class="w-3.5 h-3.5 text-slate-400"></i>
                                <span>${order.email}</span>
                            </div>` : ''}
                        </div>

                        <!-- Catatan / Alamat -->
                        ${order.catatan ? `
                        <div class="text-xs space-y-1">
                            <span class="text-slate-400 font-medium flex items-center gap-1">
                                <i data-lucide="map-pin" class="w-3 h-3"></i> Alamat Pengiriman
                            </span>
                            <p class="text-slate-700 pl-4 border-l-2 border-slate-200 py-0.5">${order.catatan}</p>
                        </div>` : ''}

                        <!-- Rincian Produk -->
                        <div class="space-y-1.5 pt-2 border-t border-slate-100">
                            <span class="text-xs font-semibold text-slate-900 flex items-center gap-1">
                                <i data-lucide="list" class="w-3.5 h-3.5 text-slate-400"></i> Detail Item
                            </span>
                            ${itemsHtml}
                        </div>

                        <!-- Total & Payment Method -->
                        <div class="bg-slate-900 text-white p-3.5 rounded-xl flex items-center justify-between mt-3 shadow-inner">
                            <div>
                                <p class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Metode Pembayaran</p>
                                <p class="text-xs font-medium text-slate-200 mt-0.5">${order.metode_pembayaran || 'Tunai'}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Total Bayar</p>
                                <p class="text-sm font-bold text-emerald-400">Rp ${Number(order.total_bayar || 0).toLocaleString('id-ID')}</p>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            // Inisialisasi ikon Lucide
            lucide.createIcons();
        }
    </script>
</body>
</html>
