<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Status Pesanan</title>
    <link rel="stylesheet" href="detail_pesanan.css">
    <link rel="stylesheet" href="transaksi.css">
    <style>
        .order-card {
            background: #fff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
        }
        .badge-belum-bayar { background-color: #f39c12; color: white; }
        .badge-dikemas { background-color: #3498db; color: white; }
        .badge-verifikasi { background-color: #9b59b6; color: white; }
        .empty-orders {
            text-align: center;
            padding: 40px 20px;
            color: #7f8c8d;
        }
        .btn-home {
            display: block;
            text-align: center;
            background: #2c3e50;
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h2>Status Pesanan Saya</h2>
        </div>

        <div id="list-status-container" style="margin-top: 15px;">
            <p style="text-align: center; color: #7f8c8d;">Memuat status pesanan...</p>
        </div>

        <a href="landing_page.html" class="btn-home">← Kembali ke Beranda</a>
    </div>

    <script>
        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('list-status-container');
            const daftarPesanan = JSON.parse(localStorage.getItem('user_orders') || '[]');

            if (daftarPesanan.length === 0) {
                container.innerHTML = `
                    <div class="empty-orders">
                        <p>Belum ada riwayat pesanan aktif.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';

            daftarPesanan.forEach(order => {
                let badgeClass = 'badge-dikemas';
                if (order.status === 'Belum Bayar') badgeClass = 'badge-belum-bayar';
                else if (order.status.includes('Menunggu')) badgeClass = 'badge-verifikasi';

                let itemsHTML = '';
                if (Array.isArray(order.items)) {
                    order.items.forEach(item => {
                        const nama = item.nama_produk || item.nama || 'Produk';
                        const qty = item.jumlah || item.qty || 1;
                        itemsHTML += `<div style="font-size: 13px; color: #555;">• ${nama} (${qty}x)</div>`;
                    });
                }

                const cardHTML = `
                    <div class="order-card">
                        <div class="order-header">
                            <span><strong>${order.id_transaksi}</strong></span>
                            <span class="badge ${badgeClass}">${order.status}</span>
                        </div>
                        <div style="margin-bottom: 8px;">
                            <small style="color: #888;">${order.tanggal} | Metode: ${order.metode_pembayaran}</small>
                        </div>
                        <div style="margin-bottom: 10px;">
                            ${itemsHTML}
                        </div>
                        <div style="display: flex; justify-content: space-between; border-top: 1px dashed #eee; padding-top: 8px; font-weight: bold;">
                            <span>Total:</span>
                            <span style="color: #e74c3c;">${formatRupiah(order.total_bayar)}</span>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHTML);
            });
        });
    </script>
</body>
</html>
