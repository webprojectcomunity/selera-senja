<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran QRIS - Sistem Transaksi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: center;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 20px;
        }
        .subtitle {
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 20px;
        }
        .trx-info {
            background: #fafafa;
            border: 1px solid #e1e8ed;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            text-align: left;
        }
        .trx-info p {
            font-size: 13px;
            margin-bottom: 4px;
            color: #555;
            display: flex;
            justify-content: space-between;
        }
        .trx-info p span:last-child {
            font-weight: 600;
            color: #333;
        }
        .qris-box {
            background: #fff;
            border: 2px dashed #3498db;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            display: inline-block;
            width: 100%;
        }
        /* Loading & QR Image Styling */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 200px;
            gap: 12px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .qris-img {
            width: 200px;
            height: 200px;
            object-fit: contain;
            border-radius: 6px;
            margin: 0 auto;
            display: none;
        }
        .timer-box {
            font-size: 14px;
            color: #e74c3c;
            font-weight: bold;
            margin-bottom: 20px;
            background: #fdf2f2;
            padding: 8px;
            border-radius: 6px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-confirm {
            background: #2ecc71;
            color: white;
        }
        .btn-confirm:hover {
            background: #27ae60;
        }
        .btn-cancel {
            background: #e74c3c;
            color: white;
        }
        .btn-cancel:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Pembayaran QRIS</h2>
        <p class="subtitle">Silakan tunggu, sistem sedang menyiapkan kode QR Anda</p>

        <div class="trx-info">
            <p><span>No. Transaksi:</span> <span id="lbl-trx-id">-</span></p>
            <p><span>Total Tagihan:</span> <span id="lbl-total-bayar" style="color: #27ae60;">Rp 0</span></p>
            <p><span>Nama Akun:</span> <span id="lbl-user">-</span></p>
        </div>

        <div class="qris-box">
            <!-- Tampilan Loading Saat Belum Di-upload Owner -->
            <div id="qris-loading" class="loading-container">
                <div class="spinner"></div>
                <span style="font-size: 13px; color: #555; font-weight: 500;">Sedang memuat kode QR unik...<br>Harap tunggu sebentar.</span>
            </div>
            <!-- Gambar QRIS yang Di-upload Owner akan muncul di sini -->
            <img id="qris-image" class="qris-img" src="" alt="QRIS Pembayaran">
        </div>

        <div class="timer-box" id="countdown-timer">
            Sisa Waktu Pembayaran: 15:00
        </div>

        <div class="btn-group">
            <button type="button" class="btn btn-cancel" onclick="batalkanPesanan()">Batalkan</button>
            <button type="button" class="btn btn-confirm" onclick="konfirmasiSudahBayar()">Saya Sudah Bayar</button>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwBLIlk6lbANUmDwdUkMtldg0AB5aDD-9_7bAQJ6UAbcTHZeHwlnLluwyXIG2jWRxNX/exec';
        let currentTrxId = '';

        document.addEventListener('DOMContentLoaded', () => {
            const rawData = localStorage.getItem('active_qris_trx');
            if (!rawData) {
                alert("Tidak ada sesi pembayaran QRIS yang aktif.");
                window.location.replace('order.html');
                return;
            }

            const qrisData = JSON.parse(rawData);
            currentTrxId = qrisData.id_transaksi;
            
            document.getElementById('lbl-trx-id').innerText = currentTrxId || '-';
            document.getElementById('lbl-total-bayar').innerText = formatRupiah(qrisData.total_bayar || 0);
            document.getElementById('lbl-user').innerText = qrisData.nama_user || '-';

            mulaiTimer(15 * 60);

            // Mulai cek secara berkala (setiap 3 detik) apakah Owner sudah mengupload QRIS untuk transaksi ini
            cekStatusQrOwner();
            setInterval(cekStatusQrOwner, 3000);
        });

        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);
        }

        function mulaiTimer(durasiDetik) {
            let timer = durasiDetik, minutes, seconds;
            const display = document.getElementById('countdown-timer');

            const interval = setInterval(() => {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                display.innerText = `Sisa Waktu Pembayaran: ${minutes}:${seconds}`;

                if (--timer < 0) {
                    clearInterval(interval);
                    alert("Waktu pembayaran QRIS telah habis.");
                    batalkanPesanan();
                }
            }, 1000);
        }

        // Fungsi mengecek apakah QRIS sudah di-upload oleh owner di server/spreadsheet
        async function cekStatusQrOwner() {
            try {
                const response = await fetch(`${APPS_SCRIPT_URL}?action=getQrisImage&id_transaksi=${currentTrxId}`);
                const result = await response.json();
                
                if (result.success && result.qr_url) {
                    // Jika owner sudah mengupload gambar QRIS
                    const imgElem = document.getElementById('qris-image');
                    const loadElem = document.getElementById('qris-loading');
                    
                    if (imgElem.src !== result.qr_url) {
                        imgElem.src = result.qr_url;
                        loadElem.style.display = 'none';
                        imgElem.style.display = 'block';
                    }
                }
            } catch (e) {
                console.error("Gagal memeriksa status QR:", e);
            }
        }

        async function konfirmasiSudahBayar() {
            if (!confirm("Apakah Anda yakin sudah menyelesaikan pembayaran QRIS? Status pesanan akan diperbarui menjadi 'Sedang Dikemas'.")) {
                return;
            }

            const payload = {
                action: "updateStatusTransaction",
                id_transaksi: currentTrxId,
                status: "Sedang Dikemas"
            };

            try {
                let iframe = document.getElementById('hidden_iframe');
                if (!iframe) {
                    iframe = document.createElement('iframe');
                    iframe.name = 'hidden_iframe';
                    iframe.id = 'hidden_iframe';
                    iframe.style.display = 'none';
                    document.body.appendChild(iframe);
                }

                let form = document.getElementById('hidden_form_qris');
                if (!form) {
                    form = document.createElement('form');
                    form.id = 'hidden_form_qris';
                    form.method = 'POST';
                    form.action = APPS_SCRIPT_URL;
                    form.target = 'hidden_iframe';
                    document.body.appendChild(form);
                } else {
                    form.innerHTML = '';
                }

                const inputPayload = document.createElement('input');
                inputPayload.type = 'hidden';
                inputPayload.name = 'payload';
                inputPayload.value = JSON.stringify(payload);
                form.appendChild(inputPayload);

                form.submit();

                setTimeout(() => {
                    localStorage.removeItem('active_qris_trx');
                    alert("Pembayaran dikonfirmasi! Pesanan Anda sedang diproses.");
                    window.location.replace('order.html');
                }, 1000);

            } catch (err) {
                console.error("Gagal memperbarui status di server:", err);
                alert("Terjadi kesalahan koneksi.");
                window.location.replace('order.html');
            }
        }

        function batalkanPesanan() {
            localStorage.removeItem('active_qris_trx');
            alert("Pembayaran dibatalkan.");
            window.location.replace('order.html');
        }
    </script>
</body>
</html>
